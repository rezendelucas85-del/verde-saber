<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Verde Saber</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.login-page {
      background: url('img/floresta.jpg') center/cover no-repeat fixed;
    }
    body.login-page::before {
      content:''; position:fixed; inset:0;
      background: rgba(0,28,10,.42);
      z-index:0;
    }

    .eco-card {
      background: transparent; border-radius:0; padding:36px 32px;
      width:100%; max-width:460px;
      text-align:center; position:relative; z-index:1;
    }
    .eco-card-col { display:flex; flex-direction:column; align-items:center; }

    .eco-logo-circle {
      width:120px; height:120px;
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 10px;
    }
    .eco-logo-circle img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 4px 16px rgba(0,0,0,.4)); }
    .eco-title { font-size:2rem; font-weight:900; color:#fff; margin-bottom:6px; text-shadow:0 2px 10px rgba(0,0,0,.4); }
    .eco-subtitle { font-size:.95rem; color:rgba(255,255,255,.9); font-weight:600; margin-bottom:22px; }
    .eco-question { font-size:1.1rem; font-weight:800; color:#fff; margin-bottom:16px; text-shadow:0 1px 6px rgba(0,0,0,.3); }

    .role-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; }
    .role-card {
      background:#fff; border:2px solid var(--green-200); border-radius:18px;
      padding:22px 12px; cursor:pointer; transition:all .2s;
      display:flex; flex-direction:column; align-items:center; gap:8px;
      font-family:'Nunito',sans-serif;
    }
    .role-card:hover { transform:translateY(-4px); border-color:var(--primary); box-shadow:0 6px 18px var(--shadow); }
    .role-card:active { transform:scale(.96); }
    .role-card.highlighted { background:var(--green-100); border-color:var(--primary); }
    .role-icon { font-size:2.8rem; }
    .role-card strong { font-size:1rem; font-weight:800; color:var(--text-dark); }
    .role-card small { font-size:.78rem; font-weight:600; color:var(--text-light); }

    .back-pill {
      align-self:flex-start;
      background:rgba(255,255,255,.2); border:none; border-radius:20px;
      padding:8px 16px; font-family:'Nunito',sans-serif;
      font-size:.88rem; font-weight:700; color:#fff;
      cursor:pointer; transition:all .2s; margin-bottom:20px;
    }
    .back-pill:hover { background:rgba(255,255,255,.35); }

    .eco-logo-sm {
      width:52px; height:52px; background:var(--primary-dark); border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:1.8rem; margin-bottom:10px;
      box-shadow:0 4px 12px rgba(76,175,80,.35);
    }
    .eco-title-sm { font-size:1.5rem; font-weight:900; color:#fff; margin-bottom:4px; text-shadow:0 2px 8px rgba(0,0,0,.35); }
    .eco-subtitle-sm { font-size:.9rem; color:rgba(255,255,255,.88); font-weight:600; margin-bottom:18px; }

    .reg-avatar-grid {
      display:grid; grid-template-columns:repeat(5,1fr);
      gap:8px; margin:0 0 16px; width:100%;
    }
    .reg-avatar-btn {
      aspect-ratio:1; font-size:1.7rem;
      background:rgba(255,255,255,.85); border:3px solid transparent;
      border-radius:12px; cursor:pointer; transition:all .2s;
      display:flex; align-items:center; justify-content:center;
    }
    .reg-avatar-btn:hover { background:rgba(255,255,255,.95); }
    .reg-avatar-btn.selected { border-color:var(--primary-dark); background:#fff; transform:scale(1.12); }

    .eco-card .form-group label { color:rgba(255,255,255,.9); }
    .form-error { color:#FFB3B3; font-size:.85rem; font-weight:700; margin:-6px 0 10px; }

    .btn-enter-app {
      width:100%; padding:15px; margin-top:6px;
      background:linear-gradient(135deg,#66BB6A,#43A047);
      border:none; border-radius:50px; font-family:'Nunito',sans-serif;
      font-size:1rem; font-weight:800; color:#fff;
      cursor:pointer; transition:all .2s;
      box-shadow:0 4px 14px rgba(76,175,80,.5);
    }
    .btn-enter-app:hover { box-shadow:0 6px 20px rgba(76,175,80,.7); }
    .btn-enter-app:active { transform:scale(.97); }

    .v-hidden { display:none!important; }
  </style>
</head>
<body class="login-page">

  <!-- View: Landing -->
  <div id="viewLanding" class="eco-card">
    <div class="eco-logo-circle"><img src="img/mascote.png" alt="Verde Saber mascote"></div>
    <h1 class="eco-title">Verde Saber</h1>
    <p class="eco-subtitle">Aprendendo a cuidar do planeta</p>
    <h2 class="eco-question">O que você quer fazer?</h2>
    <div class="role-grid">
      <button class="role-card" onclick="openLogin()">
        <span class="role-icon">😊</span>
        <strong>Entrar</strong>
        <small>Já tenho conta</small>
      </button>
      <button class="role-card highlighted" onclick="openRegister()">
        <span class="role-icon">✨</span>
        <strong>Criar conta</strong>
        <small>Sou novo aqui!</small>
      </button>
    </div>
  </div>

  <!-- View: Login -->
  <div id="viewLogin" class="eco-card eco-card-col v-hidden">
    <button class="back-pill" onclick="showView('landing')">← Voltar</button>
    <div class="eco-logo-sm">😊</div>
    <h1 class="eco-title-sm">Bem-vindo de volta!</h1>
    <p class="eco-subtitle-sm">Entre com seu nome e senha</p>
    <div class="form-group" style="width:100%;text-align:left">
      <label for="loginName">Nome do aluno</label>
      <input type="text" id="loginName" placeholder="Seu nome" maxlength="30"
             autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('loginPwd').focus()">
    </div>
    <div class="form-group" style="width:100%;text-align:left">
      <label for="loginPwd">Senha</label>
      <input type="password" id="loginPwd" placeholder="••••"
             autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <p id="loginError" class="form-error v-hidden">Nome ou senha incorretos!</p>
    <button class="btn-enter-app" onclick="doLogin()">Entrar!</button>
  </div>

  <!-- View: Cadastro -->
  <div id="viewRegister" class="eco-card eco-card-col v-hidden">
    <button class="back-pill" onclick="showView('landing')">← Voltar</button>
    <div class="eco-logo-sm">✨</div>
    <h1 class="eco-title-sm">Criar minha conta</h1>
    <p class="eco-subtitle-sm">Escolha seu avatar favorito!</p>
    <div id="regAvatarGrid" class="reg-avatar-grid"></div>
    <div class="form-group" style="width:100%;text-align:left">
      <label for="regSchool">Nome da escola</label>
      <input type="text" id="regSchool" placeholder="Ex: Escola Estadual..." maxlength="50"
             autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('regName').focus()">
    </div>
    <div class="form-group" style="width:100%;text-align:left">
      <label for="regName">Seu nome</label>
      <input type="text" id="regName" placeholder="Como te chamam?" maxlength="30"
             autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('regPwd').focus()">
    </div>
    <div class="form-group" style="width:100%;text-align:left">
      <label for="regPwd">Senha secreta</label>
      <input type="password" id="regPwd" placeholder="Ex: 1234"
             autocomplete="off" onkeydown="if(event.key==='Enter')doRegister()">
    </div>
    <p id="regError" class="form-error v-hidden"></p>
    <button class="btn-enter-app" onclick="doRegister()">Criar conta! 🎉</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const AVATARS = ['🐸','🦋','🌻','🦊','🐬','🐢','🐹','🐧','🐝','🦜'];
    let selectedRegAvatar = AVATARS[0];

    function showView(name) {
      document.querySelectorAll('[id^="view"]').forEach(el => el.classList.add('v-hidden'));
      document.getElementById('view' + name[0].toUpperCase() + name.slice(1)).classList.remove('v-hidden');
    }

    function openLogin() {
      document.getElementById('loginName').value = '';
      document.getElementById('loginPwd').value = '';
      document.getElementById('loginError').classList.add('v-hidden');
      showView('login');
      setTimeout(() => document.getElementById('loginName').focus(), 300);
    }

    function openRegister() {
      selectedRegAvatar = AVATARS[0];
      document.getElementById('regAvatarGrid').innerHTML = AVATARS.map(a =>
        `<button class="reg-avatar-btn${a === selectedRegAvatar ? ' selected' : ''}"
                 onclick="pickRegAvatar('${a}')">${a}</button>`
      ).join('');
      document.getElementById('regSchool').value = '';
      document.getElementById('regName').value = '';
      document.getElementById('regPwd').value = '';
      document.getElementById('regError').classList.add('v-hidden');
      showView('register');
      setTimeout(() => document.getElementById('regSchool').focus(), 300);
    }

    function pickRegAvatar(a) {
      selectedRegAvatar = a;
      document.querySelectorAll('.reg-avatar-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.textContent === a);
      });
    }

    function doLogin() {
      const name  = document.getElementById('loginName').value.trim();
      const pwd   = document.getElementById('loginPwd').value;
      const errEl = document.getElementById('loginError');

      if (!name) {
        errEl.textContent = 'Digite seu nome!';
        errEl.classList.remove('v-hidden');
        document.getElementById('loginName').focus();
        return;
      }

      const student = VS.getStudents().find(
        s => s.name.toLowerCase() === name.toLowerCase()
      );

      if (!student) {
        errEl.textContent = 'Aluno não encontrado!';
        errEl.classList.remove('v-hidden');
        const inp = document.getElementById('loginName');
        inp.classList.add('shake');
        setTimeout(() => inp.classList.remove('shake'), 500);
        return;
      }

      if (student.password && student.password !== pwd) {
        errEl.textContent = 'Senha incorreta!';
        errEl.classList.remove('v-hidden');
        const inp = document.getElementById('loginPwd');
        inp.classList.add('shake');
        setTimeout(() => inp.classList.remove('shake'), 500);
        return;
      }

      errEl.classList.add('v-hidden');
      VS.setCurrentStudent(student.id);
      window.location.href = 'home.html';
    }

    function doRegister() {
      const school = document.getElementById('regSchool').value.trim();
      const name   = document.getElementById('regName').value.trim();
      const pwd    = document.getElementById('regPwd').value.trim();
      const errEl  = document.getElementById('regError');

      if (!name) {
        errEl.textContent = 'Digite seu nome!';
        errEl.classList.remove('v-hidden');
        document.getElementById('regName').focus();
        return;
      }

      const exists = VS.getStudents().some(
        s => s.name.toLowerCase() === name.toLowerCase()
      );
      if (exists) {
        errEl.textContent = 'Esse nome já está em uso. Escolha outro!';
        errEl.classList.remove('v-hidden');
        document.getElementById('regName').focus();
        return;
      }

      errEl.classList.add('v-hidden');
      const student = VS.createStudent(name, selectedRegAvatar, pwd, school);
      VS.setCurrentStudent(student.id);
      window.location.href = 'home.html';
    }

    VS.init().then(() => showView('landing'));
  </script>
</body>
</html>

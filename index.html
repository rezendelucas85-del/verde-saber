<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EcoAmigos</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-bg-deco{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
    .leaf{position:absolute;font-size:2.4rem;opacity:.09;}
    .leaf:nth-child(1){top:5%;left:4%;animation:bounce 6s ease-in-out infinite;}
    .leaf:nth-child(2){top:12%;right:6%;animation:bounce 7s 1s ease-in-out infinite;}
    .leaf:nth-child(3){bottom:18%;left:8%;animation:bounce 5s 2s ease-in-out infinite;}
    .leaf:nth-child(4){bottom:10%;right:5%;animation:bounce 8s .5s ease-in-out infinite;}
    .leaf:nth-child(5){top:40%;left:2%;animation:bounce 6.5s 3s ease-in-out infinite;}
    .leaf:nth-child(6){top:55%;right:3%;animation:bounce 7.5s 1.5s ease-in-out infinite;}

    /* Card base */
    .eco-card{
      background:#fff;border-radius:28px;padding:36px 32px;
      width:100%;max-width:460px;
      box-shadow:0 8px 32px rgba(76,175,80,.15);
      text-align:center;position:relative;z-index:1;
    }

    /* Logo */
    .eco-logo-circle{
      width:72px;height:72px;background:var(--primary-dark);border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:2.5rem;margin:0 auto 14px;
      box-shadow:0 4px 16px rgba(76,175,80,.4);
    }
    .eco-title{font-size:2rem;font-weight:900;color:var(--primary-dark);margin-bottom:6px;}
    .eco-subtitle{font-size:.95rem;color:var(--text-light);font-weight:600;margin-bottom:28px;}
    .eco-question{font-size:1.1rem;font-weight:800;color:var(--text-dark);margin-bottom:20px;}

    /* Role cards */
    .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .role-card{
      background:#fff;border:2px solid var(--green-200);border-radius:18px;
      padding:22px 12px;cursor:pointer;transition:all .2s;
      display:flex;flex-direction:column;align-items:center;gap:8px;
      font-family:'Nunito',sans-serif;
    }
    .role-card:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 6px 18px var(--shadow);}
    .role-card:active{transform:scale(.96);}
    .role-card.highlighted{background:var(--green-100);border-color:var(--primary);}
    .role-icon{font-size:2.8rem;}
    .role-card strong{font-size:1rem;font-weight:800;color:var(--text-dark);}
    .role-card small{font-size:.78rem;font-weight:600;color:var(--text-light);}

    /* Student selection view */
    .eco-card-col{
      display:flex;flex-direction:column;align-items:center;
    }
    .back-pill{
      align-self:flex-start;
      background:var(--green-100);border:none;border-radius:20px;
      padding:8px 16px;font-family:'Nunito',sans-serif;
      font-size:.88rem;font-weight:700;color:var(--text-dark);
      cursor:pointer;transition:all .2s;margin-bottom:20px;
    }
    .back-pill:hover{background:var(--green-200);}
    .eco-logo-sm{
      width:52px;height:52px;background:var(--primary-dark);border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:1.8rem;margin-bottom:10px;
      box-shadow:0 4px 12px rgba(76,175,80,.35);
    }
    .eco-title-sm{font-size:1.5rem;font-weight:900;color:var(--primary-dark);margin-bottom:4px;}
    .eco-subtitle-sm{font-size:.9rem;color:var(--text-light);font-weight:600;margin-bottom:18px;}

    /* Avatar grid */
    .avatars-grid{
      display:grid;grid-template-columns:repeat(3,1fr);
      gap:12px;width:100%;
    }
    .avatar-btn{
      background:var(--green-50);border:2px solid var(--green-200);
      border-radius:16px;padding:16px 8px;
      cursor:pointer;transition:all .2s;
      display:flex;flex-direction:column;align-items:center;gap:6px;
      font-family:'Nunito',sans-serif;
    }
    .avatar-btn:hover{background:var(--green-100);border-color:var(--primary);transform:translateY(-3px);}
    .avatar-btn:active{transform:scale(.95);}
    .avatar-btn-emoji{font-size:2.8rem;}
    .avatar-btn-name{font-size:.8rem;font-weight:700;color:var(--text-dark);}
    .no-students-msg{
      grid-column:1/-1;padding:24px 0;
      color:var(--text-light);font-size:.9rem;font-weight:600;line-height:1.6;
    }

    /* Password view */
    .sel-emoji{font-size:5rem;margin:10px 0 6px;display:block;}
    .sel-name{font-size:1.5rem;font-weight:900;color:var(--primary-dark);margin-bottom:4px;}
    .sel-hint{font-size:.9rem;color:var(--text-light);font-weight:600;margin-bottom:20px;}
    .pwd-error{color:#e53935;font-size:.85rem;font-weight:700;margin:-8px 0 10px;}
    .btn-enter-app{
      width:100%;padding:15px;margin-top:6px;
      background:var(--green-50);border:2px solid var(--green-200);
      border-radius:50px;font-family:'Nunito',sans-serif;
      font-size:1rem;font-weight:800;color:var(--text-dark);
      cursor:pointer;transition:all .2s;
    }
    .btn-enter-app:hover{background:var(--green-100);border-color:var(--primary);}
    .btn-enter-app:active{transform:scale(.97);}

    .v-hidden{display:none!important;}
  </style>
</head>
<body class="login-page">
  <div class="login-bg-deco">
    <span class="leaf">🌿</span><span class="leaf">🍃</span>
    <span class="leaf">🍀</span><span class="leaf">🌱</span>
    <span class="leaf">🌾</span><span class="leaf">🌵</span>
  </div>

  <!-- View: Seleção de perfil -->
  <div id="viewLanding" class="eco-card">
    <div class="eco-logo-circle">🌍</div>
    <h1 class="eco-title">EcoAmigos</h1>
    <p class="eco-subtitle">Aprendendo a cuidar do planeta</p>
    <h2 class="eco-question">Quem está acessando?</h2>
    <div class="role-grid">
      <button class="role-card highlighted" onclick="goTeacher()">
        <span class="role-icon">👩‍🏫</span>
        <strong>Professor</strong>
        <small>Gerenciar turma</small>
      </button>
      <button class="role-card" onclick="goStudent()">
        <span class="role-icon">😊</span>
        <strong>Sou aluno</strong>
        <small>Fazer atividades</small>
      </button>
    </div>
  </div>

  <!-- View: Escolha de aluno -->
  <div id="viewStudents" class="eco-card eco-card-col v-hidden">
    <button class="back-pill" onclick="showView('landing')">← Voltar</button>
    <div class="eco-logo-sm">🌍</div>
    <h1 class="eco-title-sm">EcoAmigos</h1>
    <p class="eco-subtitle-sm">Quem está jogando hoje?</p>
    <div id="avatarsGrid" class="avatars-grid"></div>
  </div>

  <!-- View: Senha do aluno -->
  <div id="viewPassword" class="eco-card eco-card-col v-hidden">
    <button class="back-pill" onclick="showView('students')">← Voltar</button>
    <span id="selEmoji" class="sel-emoji"></span>
    <h2 id="selName" class="sel-name"></h2>
    <p class="sel-hint">Digite sua senha secreta</p>
    <div class="form-group" style="width:100%;text-align:left">
      <label for="pwdInput">Senha</label>
      <input type="password" id="pwdInput" placeholder="••••"
             autocomplete="off" onkeydown="if(event.key==='Enter')submitLogin()">
    </div>
    <p id="pwdError" class="pwd-error v-hidden">Senha incorreta! Tente novamente.</p>
    <button class="btn-enter-app" onclick="submitLogin()">Entrar no app!</button>
  </div>

  <script src="js/app.js"></script>
  <script>
    let currentStudentId = null;

    function showView(name) {
      document.querySelectorAll('[id^="view"]').forEach(el => el.classList.add('v-hidden'));
      document.getElementById('view' + name[0].toUpperCase() + name.slice(1)).classList.remove('v-hidden');
    }

    function goTeacher() {
      window.location.href = 'professor.html';
    }

    function goStudent() {
      renderAvatars();
      showView('students');
    }

    function renderAvatars() {
      const students = VS.getStudents();
      const grid = document.getElementById('avatarsGrid');
      if (students.length === 0) {
        grid.innerHTML = `<p class="no-students-msg">
          Nenhum aluno cadastrado ainda.<br>Peça ao professor para criar seu perfil.
        </p>`;
        return;
      }
      grid.innerHTML = students.map(s => `
        <button class="avatar-btn" onclick="selectStudent('${s.id}')">
          <span class="avatar-btn-emoji">${s.avatar}</span>
          <span class="avatar-btn-name">${s.name.split(' ')[0]}</span>
        </button>
      `).join('');
    }

    function selectStudent(id) {
      const s = VS.getStudents().find(st => st.id === id);
      if (!s) return;
      currentStudentId = id;
      document.getElementById('selEmoji').textContent = s.avatar;
      document.getElementById('selName').textContent = s.name.split(' ')[0];
      document.getElementById('pwdInput').value = '';
      document.getElementById('pwdError').classList.add('v-hidden');
      showView('password');
      setTimeout(() => document.getElementById('pwdInput').focus(), 300);
    }

    function submitLogin() {
      const s = VS.getStudents().find(st => st.id === currentStudentId);
      if (!s) return;
      const entered = document.getElementById('pwdInput').value;
      if (s.password && s.password !== entered) {
        const inp = document.getElementById('pwdInput');
        inp.classList.add('shake');
        setTimeout(() => inp.classList.remove('shake'), 500);
        document.getElementById('pwdError').classList.remove('v-hidden');
        return;
      }
      VS.setCurrentStudent(currentStudentId);
      window.location.href = 'home.html';
    }

    showView('landing');
  </script>
</body>
</html>

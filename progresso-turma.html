<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Verde Saber – Progresso da Turma</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="back-btn" id="headerBack">← Painel</button>
      <span class="header-title" id="headerTitle">📊 Progresso da Turma</span>
    </div>
  </header>

  <div id="listView">
    <div class="progresso-container" id="studentList"></div>
  </div>

  <div id="detailView" class="hidden">
    <div class="progresso-container" id="detailContent"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  <script>
    function formatDate(ts) {
      return ts ? new Date(ts).toLocaleDateString('pt-BR') : '—';
    }

    function renderProgressBars(prog) {
      const bars = [
        { label: '📚 Histórias', val: prog.stories, total: prog.storiesTotal, color: 'linear-gradient(90deg,#66BB6A,#43A047)' },
        { label: '🎮 Jogos',    val: prog.games,   total: prog.gamesTotal,   color: 'linear-gradient(90deg,#FFD54F,#FFA000)' },
        { label: '💡 Dicas',   val: prog.tips,    total: prog.tipsTotal,    color: 'linear-gradient(90deg,#F48FB1,#E91E63)' }
      ];
      return `<div class="conq-section">
        <h2 class="conq-section-title">📊 Progresso por Categoria</h2>
        <div class="cat-progress-list">
          ${bars.map(c => `
            <div class="cat-progress-item">
              <div class="cat-progress-header">
                <span>${c.label}</span>
                <span class="cat-progress-count">${c.val}/${c.total}</span>
              </div>
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" style="width:${c.total > 0 ? Math.round(c.val/c.total*100) : 0}%;background:${c.color}"></div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
    }

    function renderMedalsSection(medals, earnedCount) {
      return `<div class="conq-section">
        <h2 class="conq-section-title">🏅 Medalhas <span class="medals-count-badge">${earnedCount}/8</span></h2>
        <div class="medals-grid">
          ${medals.map(m => `
            <div class="medal-card ${m.earned ? 'earned' : 'locked'}">
              <div class="medal-icon">${m.earned ? m.icon : '🔒'}</div>
              <div class="medal-info">
                <div class="medal-title">${m.title}</div>
                <div class="medal-desc">${m.desc}</div>
              </div>
              ${m.earned ? '<span class="medal-check">✅</span>' : ''}
            </div>`).join('')}
        </div>
      </div>`;
    }

    function renderActivities(s) {
      const storyRows = STORIES.map(story => {
        const sv = s.progress?.stories?.[story.id];
        const done = !!sv?.completed;
        const detail = done
          ? '⭐'.repeat(sv.stars || 0) + ' · ' + formatDate(sv.completedAt)
          : 'Não concluída';
        return `<div class="activity-row ${done ? 'done' : 'pending'}">
          <span class="activity-status">${done ? '✅' : '⬜'}</span>
          <span class="activity-name">${story.icon} ${story.title}</span>
          <span class="activity-detail">${detail}</span>
        </div>`;
      }).join('');

      const gameRows = GAMES.filter(g => !g.comingSoon).map(game => {
        const gv = s.progress?.games?.[game.id];
        const done = (gv?.played || 0) > 0;
        const detail = done
          ? '🏆 ' + gv.highScore + ' pts · ' + gv.played + 'x · ' + formatDate(gv.lastPlayed)
          : 'Não jogado';
        return `<div class="activity-row ${done ? 'done' : 'pending'}">
          <span class="activity-status">${done ? '✅' : '⬜'}</span>
          <span class="activity-name">${game.icon} ${game.title}</span>
          <span class="activity-detail">${detail}</span>
        </div>`;
      }).join('');

      return `<div class="conq-section">
        <h2 class="conq-section-title">📋 Atividades</h2>
        <div class="activities-list">
          <div class="activity-group-title">📚 Histórias</div>
          ${storyRows}
          <div class="activity-group-title" style="margin-top:10px">🎮 Jogos</div>
          ${gameRows}
        </div>
      </div>`;
    }

    function showListView() {
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('headerBack').onclick = () => window.location.href = 'professor.html';
      document.getElementById('headerBack').textContent = '← Painel';
      document.getElementById('headerTitle').textContent = '📊 Progresso da Turma';
    }

    function showDetailView(studentId) {
      const s = VS.getStudents().find(st => st.id === studentId);
      if (!s) return;

      document.getElementById('listView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
      document.getElementById('headerBack').onclick = showListView;
      document.getElementById('headerBack').textContent = '← Turma';
      document.getElementById('headerTitle').textContent = s.name;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const prog = VS.getStudentProgressData(s);
      const medals = VS.getStudentMedals(s);
      const earnedCount = medals.filter(m => m.earned).length;
      const stars = VS.getStudentStars(s);
      const today = new Date().toDateString();
      const isActive = s.lastActive && new Date(s.lastActive).toDateString() === today;
      const statusClass = isActive ? 'detail-status-active' : 'detail-status-inactive';
      const statusText = isActive
        ? '● Ativo hoje'
        : '○ ' + (s.lastActive ? 'Último acesso: ' + formatDate(s.lastActive) : 'Nunca acessou');

      document.getElementById('detailContent').innerHTML =
        `<div class="detail-student-card">
          <div class="detail-avatar">${s.avatar}</div>
          <div class="detail-info">
            <div class="detail-name">${s.name}</div>
            <div class="detail-meta">Nível ${s.level || 1} · 🪙 ${s.coins || 0} moedas · ⭐ ${stars} estrelas</div>
            <div class="${statusClass}">${statusText}</div>
          </div>
        </div>` +
        renderProgressBars(prog) +
        renderMedalsSection(medals, earnedCount) +
        renderActivities(s);
    }

    VS.init().then(() => {
      VS.requireTeacherAuth();
      document.getElementById('headerBack').onclick = () => window.location.href = 'professor.html';

      const students = VS.getStudents();
      const listEl = document.getElementById('studentList');

      if (students.length === 0) {
        listEl.innerHTML = `<div class="empty-turma-prog">
          <p style="font-size:3rem;margin-bottom:12px">👥</p>
          <p>Nenhum aluno cadastrado ainda.</p>
          <a href="professor.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex">← Voltar ao painel</a>
        </div>`;
        return;
      }

      listEl.innerHTML = students.map(s => {
        const medals = VS.getStudentMedals(s);
        const earnedCount = medals.filter(m => m.earned).length;
        const prog = VS.getStudentProgressData(s);
        const totalActivities = prog.stories + prog.games + prog.tips;
        const maxActivities = prog.storiesTotal + prog.gamesTotal + prog.tipsTotal;
        const pct = maxActivities > 0 ? Math.round(totalActivities / maxActivities * 100) : 0;
        const stars = VS.getStudentStars(s);
        return `
          <div class="student-prog-row" onclick="showDetailView('${s.id}')">
            <div class="sprow-avatar">${s.avatar}</div>
            <div class="sprow-info">
              <div class="sprow-name">${s.name}</div>
              <div class="sprow-meta">🏅 ${earnedCount} medalhas · ⭐ ${stars} estrelas · ${totalActivities}/${maxActivities} atividades</div>
              <div class="sprow-bar-wrap">
                <div class="sprow-bar-fill" style="width:${pct}%"></div>
              </div>
            </div>
            <div class="sprow-right">
              <div class="sprow-pct-big">${pct}%</div>
              <div class="sprow-pct-lbl">completo</div>
            </div>
          </div>`;
      }).join('');
    });
  </script>
</body>
</html>

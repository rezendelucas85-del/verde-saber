<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Verde Saber – Progresso da Turma</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="back-btn" id="headerBack">← Painel</button>
      <span class="header-title" id="headerTitle">📊 Progresso da Turma</span>
    </div>
  </header>

  <div id="listView">
    <div class="progresso-container" id="studentList"></div>
  </div>

  <div id="detailView" class="hidden">
    <div class="progresso-container" id="detailContent"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  <script>
    function renderStatBoxes(prog, stars) {
      return `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
        <div class="detail-stat-box">
          <span class="detail-stat-num">${prog.stories}</span>
          <span class="detail-stat-lbl">Histórias</span>
        </div>
        <div class="detail-stat-box">
          <span class="detail-stat-num">${prog.games}</span>
          <span class="detail-stat-lbl">Jogos</span>
        </div>
        <div class="detail-stat-box">
          <span class="detail-stat-num">${stars}</span>
          <span class="detail-stat-lbl">Estrelas</span>
        </div>
      </div>`;
    }

    function renderActivitiesList(s) {
      const storyRows = STORIES.map(story => {
        const done = !!s.progress?.stories?.[story.id]?.completed;
        return `<div class="activity-item">
          <span class="activity-item-icon">📖</span>
          <span class="activity-item-name">${story.title}</span>
          <span class="activity-badge ${done ? 'badge-done' : 'badge-pending'}">${done ? 'Feito' : 'Pendente'}</span>
        </div>`;
      }).join('');

      const gameRows = GAMES.filter(g => !g.comingSoon).map(game => {
        const done = (s.progress?.games?.[game.id]?.played || 0) > 0;
        return `<div class="activity-item">
          <span class="activity-item-icon">🎮</span>
          <span class="activity-item-name">${game.title}</span>
          <span class="activity-badge ${done ? 'badge-done' : 'badge-pending'}">${done ? 'Feito' : 'Pendente'}</span>
        </div>`;
      }).join('');

      const tipsDone = !!s.progress?.tips?.visited;
      const tipsRow = `<div class="activity-item">
        <span class="activity-item-icon">🍃</span>
        <span class="activity-item-name">Curiosidades ambientais</span>
        <span class="activity-badge ${tipsDone ? 'badge-done' : 'badge-pending'}">${tipsDone ? 'Feito' : 'Pendente'}</span>
      </div>`;

      return `<div class="conq-section">
        <h2 class="conq-section-title">Atividades</h2>
        <div class="activities-clean-list">
          ${storyRows}${gameRows}${tipsRow}
        </div>
      </div>`;
    }

    function renderProgressByCategory(prog) {
      const cats = [
        { label: 'Histórias',    val: prog.stories, total: prog.storiesTotal },
        { label: 'Jogos',        val: prog.games,   total: prog.gamesTotal   },
        { label: 'Curiosidades', val: prog.tips,    total: prog.tipsTotal    }
      ];
      return `<div class="conq-section">
        <h2 class="conq-section-title">Progresso por categoria</h2>
        ${cats.map(c => `
          <div class="cat-horiz-row">
            <span class="cat-horiz-label">${c.label}</span>
            <div class="progress-bar-wrap" style="flex:1">
              <div class="progress-bar-fill" style="width:${c.total > 0 ? Math.round(c.val/c.total*100) : 0}%;background:linear-gradient(90deg,#66BB6A,#43A047)"></div>
            </div>
            <span class="cat-horiz-count">${c.val}/${c.total}</span>
          </div>`).join('')}
      </div>`;
    }

    function showListView() {
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('headerBack').onclick = () => window.location.href = 'professor.html';
      document.getElementById('headerBack').textContent = '← Painel';
      document.getElementById('headerTitle').textContent = '📊 Progresso da Turma';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showDetailView(studentId) {
      const s = VS.getStudents().find(st => st.id === studentId);
      if (!s) return;

      document.getElementById('listView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
      document.getElementById('headerBack').onclick = showListView;
      document.getElementById('headerBack').textContent = '← Turma';
      document.getElementById('headerTitle').textContent = s.name;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const prog = VS.getStudentProgressData(s);
      const stars = VS.getStudentStars(s);

      document.getElementById('detailContent').innerHTML =
        renderStatBoxes(prog, stars) +
        renderActivitiesList(s) +
        renderProgressByCategory(prog);
    }

    VS.init().then(() => {
      VS.requireTeacherAuth();
      document.getElementById('headerBack').onclick = () => window.location.href = 'professor.html';

      const students = VS.getStudents();
      const listEl = document.getElementById('studentList');

      if (students.length === 0) {
        listEl.innerHTML = `<div class="empty-turma-prog">
          <p style="font-size:3rem;margin-bottom:12px">👥</p>
          <p>Nenhum aluno cadastrado ainda.</p>
          <a href="professor.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex">← Voltar ao painel</a>
        </div>`;
        return;
      }

      // Verifica se veio direto com ?student=id (link do professor.html)
      const params = new URLSearchParams(window.location.search);
      const directStudent = params.get('student');
      if (directStudent) {
        showDetailView(directStudent);
        return;
      }

      listEl.innerHTML = students.map(s => {
        const prog = VS.getStudentProgressData(s);
        const totalAct = prog.stories + prog.games + prog.tips;
        const maxAct   = prog.storiesTotal + prog.gamesTotal + prog.tipsTotal;
        const pct      = maxAct > 0 ? Math.round(totalAct / maxAct * 100) : 0;
        const stars    = VS.getStudentStars(s);
        const medals   = VS.getStudentMedals(s).filter(m => m.earned).length;
        return `
          <div class="student-prog-row" onclick="showDetailView('${s.id}')">
            <div class="sprow-avatar">${s.avatar}</div>
            <div class="sprow-info">
              <div class="sprow-name">${s.name}</div>
              <div class="sprow-meta">🏅 ${medals} medalhas · ⭐ ${stars} estrelas · ${totalAct}/${maxAct} atividades</div>
              <div class="sprow-bar-wrap">
                <div class="sprow-bar-fill" style="width:${pct}%"></div>
              </div>
            </div>
            <div class="sprow-right">
              <div class="sprow-pct-big">${pct}%</div>
              <div class="sprow-pct-lbl">completo</div>
            </div>
          </div>`;
      }).join('');
    });
  </script>
</body>
</html>

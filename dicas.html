<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Verde Saber – Dicas Verdes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home.html" class="header-logo">
      <span class="header-logo-icon">🌱</span>
      <h1>Verde Saber</h1>
    </a>
    <div class="student-badge" id="studentBadge" onclick="VS.logout()" title="Sair"></div>
  </header>

  <div class="page-header">
    <a href="home.html" class="back-btn">← Início</a>
    <h1>💡 Dicas Verdes</h1>
    <p>Pequenas atitudes que salvam o planeta!</p>
  </div>

  <div class="tips-grid" id="tipsGrid"></div>

  <nav class="app-footer" id="appFooter"></nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  <script>
    VS.init().then(() => {
      VS.requireAuth();
      VS.trackTipsVisit();
      VS.renderHeader('dicas');

      const colors = [
        { bg: '#E8F5E9', border: '#A5D6A7' },
        { bg: '#E3F2FD', border: '#90CAF9' },
        { bg: '#FFF9C4', border: '#FFD54F' },
        { bg: '#FCE4EC', border: '#F48FB1' },
        { bg: '#F3E5F5', border: '#CE93D8' },
        { bg: '#E0F7FA', border: '#80DEEA' }
      ];

      document.getElementById('tipsGrid').innerHTML = TIPS.map((tip, i) => {
        const c = colors[i % colors.length];
        return `
          <div class="tip-card" style="background:${c.bg};border-color:${c.border}">
            <span class="tip-icon">${tip.icon}</span>
            <div>
              <h3>${tip.title}</h3>
              <p>${tip.text}</p>
            </div>
          </div>`;
      }).join('');
    });
  </script>
</body>
</html>

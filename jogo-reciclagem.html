<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Verde Saber – Reciclagem</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="back-btn" onclick="confirmBack()">← Jogos</button>
      <span class="header-title">♻️ Reciclagem</span>
    </div>
    <div class="student-badge" id="studentBadge" onclick="VS.logout()" title="Sair"></div>
  </header>

  <main class="game-container">
    <!-- Barra de pontuação -->
    <div class="game-score-bar">
      <div>
        <div class="game-score">⭐ <span id="scoreDisplay">0</span></div>
        <div class="game-round" id="roundDisplay">Rodada 1 de 10</div>
      </div>
      <div class="game-lives" id="livesDisplay">❤️❤️❤️</div>
    </div>

    <!-- Exibição do item -->
    <div id="gameArea">
      <div class="item-display" id="itemDisplay">
        <span class="item-emoji" id="itemEmoji">♻️</span>
        <div class="item-name" id="itemName">Preparando...</div>
        <div class="item-question">Onde este item deve ir?</div>
      </div>

      <!-- Lixeiras -->
      <div class="bins-grid">
        <button class="bin-btn bin-papel" onclick="checkAnswer('papel')">
          <span class="bin-emoji">📄</span>
          <div class="bin-label">Papel</div>
          <div class="bin-sublabel">Azul</div>
        </button>
        <button class="bin-btn bin-plastico" onclick="checkAnswer('plastico')">
          <span class="bin-emoji">🧴</span>
          <div class="bin-label">Plástico</div>
          <div class="bin-sublabel">Vermelho</div>
        </button>
        <button class="bin-btn bin-vidro" onclick="checkAnswer('vidro')">
          <span class="bin-emoji">🫙</span>
          <div class="bin-label">Vidro</div>
          <div class="bin-sublabel">Verde</div>
        </button>
        <button class="bin-btn bin-metal" onclick="checkAnswer('metal')">
          <span class="bin-emoji">🥫</span>
          <div class="bin-label">Metal</div>
          <div class="bin-sublabel">Amarelo</div>
        </button>
        <button class="bin-btn bin-organico" onclick="checkAnswer('organico')">
          <span class="bin-emoji">🍃</span>
          <div class="bin-label">Orgânico</div>
          <div class="bin-sublabel">Marrom</div>
        </button>
        <button class="bin-btn" style="border-color:#CE93D8;background:#F3E5F5;" onclick="showHelp()">
          <span class="bin-emoji">❓</span>
          <div class="bin-label">Ajuda</div>
          <div class="bin-sublabel">Dica</div>
        </button>
      </div>
    </div>

    <!-- Tela de conclusão -->
    <div id="gameComplete" class="game-complete">
      <span style="font-size:5rem;display:block">🎊</span>
      <h2 style="font-size:2rem;color:#1B5E20;margin:14px 0 8px">Jogo Concluído!</h2>
      <p style="color:#558B2F;font-weight:600;margin-bottom:16px" id="completeFeedback"></p>
      <div style="background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border-radius:20px;padding:20px;margin-bottom:22px;">
        <div style="font-size:2.5rem;font-weight:900;color:#1B5E20" id="finalScore">0</div>
        <div style="font-size:.9rem;color:#558B2F;font-weight:700">pontos finais</div>
      </div>
      <div id="coinsResult" style="background:linear-gradient(135deg,#FFF9C4,#FFD54F);border-radius:16px;padding:12px;margin-bottom:22px;font-size:1.05rem;font-weight:800;color:#5D4037;"></div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-secondary" onclick="restartGame()">🔄 Jogar Novamente</button>
        <a href="jogos.html" class="btn btn-primary">🎮 Outros Jogos</a>
      </div>
    </div>
  </main>

  <!-- Feedback overlay -->
  <div class="dim-overlay" id="dimOverlay"></div>
  <div class="feedback-overlay" id="feedbackOverlay">
    <span class="feedback-emoji" id="feedbackEmoji"></span>
    <div class="feedback-text" id="feedbackText"></div>
    <div class="feedback-hint" id="feedbackHint"></div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  <script>
    VS.requireAuth();
    VS.renderHeader(null);

    const TOTAL_ROUNDS = 10;
    let score = 0;
    let lives = 3;
    let round = 0;
    let currentItem = null;
    let items = [];
    let waiting = false;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startGame() {
      score = 0; lives = 3; round = 0;
      items = shuffle(RECYCLING_ITEMS).slice(0, TOTAL_ROUNDS);
      document.getElementById('gameArea').classList.remove('hidden');
      document.getElementById('gameComplete').classList.remove('active');
      updateUI();
      nextItem();
    }

    function nextItem() {
      if (round >= TOTAL_ROUNDS) { endGame(); return; }
      currentItem = items[round];
      const emoji = document.getElementById('itemEmoji');
      emoji.style.animation = 'none';
      void emoji.offsetWidth;
      emoji.style.animation = '';
      document.getElementById('itemEmoji').textContent = currentItem.emoji;
      document.getElementById('itemName').textContent = currentItem.name;
      document.getElementById('itemDisplay').className = 'item-display';
      waiting = false;
    }

    function checkAnswer(category) {
      if (waiting) return;
      waiting = true;

      if (category === currentItem.category) {
        score += 10;
        showFeedback(true, currentItem.hint);
        document.getElementById('itemDisplay').classList.add('correct-flash');
      } else {
        lives--;
        showFeedback(false, currentItem.hint);
        document.getElementById('itemDisplay').classList.add('wrong-flash');
        document.getElementById('itemDisplay').classList.add('shake');
      }

      round++;
      updateUI();

      setTimeout(() => {
        hideFeedback();
        if (lives <= 0) { endGame(); return; }
        nextItem();
      }, 2000);
    }

    function showFeedback(correct, hint) {
      const overlay = document.getElementById('feedbackOverlay');
      overlay.className = `feedback-overlay active ${correct ? 'correct-fb' : 'wrong-fb'}`;
      document.getElementById('dimOverlay').classList.add('active');
      document.getElementById('feedbackEmoji').textContent = correct ? '✅' : '❌';
      document.getElementById('feedbackText').textContent = correct ? 'Muito bem! +10 pontos!' : 'Ops! Não foi dessa vez...';
      document.getElementById('feedbackHint').textContent = `💡 ${hint}`;
    }

    function hideFeedback() {
      document.getElementById('feedbackOverlay').classList.remove('active');
      document.getElementById('dimOverlay').classList.remove('active');
    }

    function showHelp() {
      if (waiting) return;
      const catNames = {
        papel: 'Papel (azul) 📄',
        plastico: 'Plástico (vermelho) 🧴',
        vidro: 'Vidro (verde) 🫙',
        metal: 'Metal (amarelo) 🥫',
        organico: 'Orgânico (marrom) 🍃'
      };
      const overlay = document.getElementById('feedbackOverlay');
      overlay.className = 'feedback-overlay active';
      overlay.style.borderColor = '#AB47BC';
      document.getElementById('dimOverlay').classList.add('active');
      document.getElementById('feedbackEmoji').textContent = '💡';
      document.getElementById('feedbackText').textContent = 'Dica!';
      document.getElementById('feedbackHint').textContent = `"${currentItem.name}" vai em: ${catNames[currentItem.category]}`;
      setTimeout(() => { hideFeedback(); overlay.style.borderColor = ''; waiting = false; }, 2500);
      waiting = true;
    }

    function updateUI() {
      document.getElementById('scoreDisplay').textContent = score;
      document.getElementById('roundDisplay').textContent = `Rodada ${Math.min(round+1, TOTAL_ROUNDS)} de ${TOTAL_ROUNDS}`;
      const hearts = '❤️'.repeat(lives) + '🖤'.repeat(Math.max(0, 3 - lives));
      document.getElementById('livesDisplay').textContent = hearts;
    }

    function endGame() {
      hideFeedback();
      document.getElementById('gameArea').classList.add('hidden');
      const complete = document.getElementById('gameComplete');
      complete.classList.add('active');
      document.getElementById('finalScore').textContent = score;

      let feedback = '';
      if (score >= 90) feedback = '🌟 Incrível! Você é um expert em reciclagem!';
      else if (score >= 70) feedback = '🎉 Muito bem! Você conhece bastante sobre reciclagem!';
      else if (score >= 50) feedback = '👍 Bom trabalho! Continue aprendendo!';
      else feedback = '📚 Que tal tentar novamente e aprender mais?';
      document.getElementById('completeFeedback').textContent = feedback;

      const result = VS.saveGameScore('reciclagem', score);
      document.getElementById('coinsResult').textContent = result.isHighScore
        ? `🏆 Novo recorde! 🪙 +${result.coinReward} moedas!`
        : `🪙 +${result.coinReward} moedas ganhas!`;
    }

    function restartGame() {
      document.getElementById('gameComplete').classList.remove('active');
      startGame();
    }

    function confirmBack() {
      if (round > 0 && round < TOTAL_ROUNDS && !document.getElementById('gameComplete').classList.contains('active')) {
        if (!confirm('Sair do jogo? Seu progresso atual será perdido.')) return;
      }
      window.location.href = 'jogos.html';
    }

    startGame();
  </script>
</body>
</html>

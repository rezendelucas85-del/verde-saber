<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Verde Saber – Simulador de Plantio</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .plant-topbar{display:flex;justify-content:space-around;padding:12px 16px;background:#fff;border-bottom:2px solid var(--green-200);}
    .plant-stat{text-align:center;}
    .plant-stat-val{font-size:1.4rem;font-weight:900;color:var(--primary-dark);display:block;}
    .plant-stat-lbl{font-size:.72rem;font-weight:700;color:var(--text-light);}

    .resources-bar{display:flex;gap:10px;justify-content:center;padding:12px 16px;flex-wrap:wrap;}
    .resource-chip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--green-200);border-radius:20px;padding:8px 16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;color:var(--text-dark);}
    .resource-chip.depleted{opacity:.45;border-color:#ccc;}

    .hint-bar{text-align:center;font-size:.85rem;font-weight:700;color:var(--text-light);padding:0 16px 10px;}

    .garden-wrap{padding:0 16px 16px;max-width:420px;margin:0 auto;}
    .garden-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    .plot{
      aspect-ratio:1;border-radius:16px;
      border:3px solid #8D6E63;
      background:linear-gradient(135deg,#BCAAA4,#8D6E63);
      cursor:pointer;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      transition:all .2s;font-size:2.6rem;
      box-shadow:0 3px 8px rgba(0,0,0,.12);
      position:relative;
    }
    .plot:active{transform:scale(.93);}
    .plot.state-seed{background:linear-gradient(135deg,#C8E6C9,#A5D6A7);border-color:#81C784;}
    .plot.state-sprout{background:linear-gradient(135deg,#AED581,#7CB342);border-color:#558B2F;}
    .plot.state-bloom{background:linear-gradient(135deg,#FFF9C4,#FFD54F);border-color:#F9A825;animation:bloom-pop .4s ease;}
    @keyframes bloom-pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
    .water-dots{position:absolute;bottom:6px;display:flex;gap:3px;}
    .water-dot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.15);}
    .water-dot.filled{background:#29B6F6;}

    .toast{
      position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.75);color:#fff;
      padding:10px 20px;border-radius:20px;
      font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;
      opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;
    }
    .toast.show{opacity:1;}

    .plant-complete{display:none;text-align:center;padding:40px 20px 80px;}
    .plant-complete.active{display:block;}

    .end-btn-wrap{display:flex;justify-content:center;padding:0 16px 20px;}
  </style>
</head>
<body>
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:12px">
      <a href="jogos.html" class="back-btn">← Jogos</a>
      <span class="header-title">🌱 Simulador de Plantio</span>
    </div>
    <div class="student-badge" id="studentBadge" onclick="VS.logout()" title="Sair"></div>
  </header>

  <div class="plant-topbar">
    <div class="plant-stat">
      <span class="plant-stat-val" id="pScore">0</span>
      <span class="plant-stat-lbl">Pontos</span>
    </div>
    <div class="plant-stat">
      <span class="plant-stat-val" id="pGrown">0</span>
      <span class="plant-stat-lbl">Colhidas</span>
    </div>
    <div class="plant-stat">
      <span class="plant-stat-val" id="pRound">1/3</span>
      <span class="plant-stat-lbl">Safra</span>
    </div>
  </div>

  <div class="resources-bar">
    <div class="resource-chip" id="chipSeeds">🌱 <span id="seedCount">6</span> sementes</div>
    <div class="resource-chip" id="chipWater">💧 <span id="waterCount">9</span> águas</div>
  </div>

  <div class="hint-bar" id="hintBar">Clique em um canteiro para plantar!</div>

  <div class="garden-wrap">
    <div class="garden-grid" id="gardenGrid"></div>
  </div>

  <div class="end-btn-wrap" id="endBtnWrap">
    <button class="btn btn-secondary" onclick="endRound()">🧺 Encerrar Safra</button>
  </div>

  <div id="plantComplete" class="plant-complete">
    <span style="font-size:4rem;display:block;margin-bottom:12px">🌻</span>
    <h2 style="font-size:1.8rem;color:var(--text-dark);margin-bottom:8px">Boa colheita!</h2>
    <p style="color:var(--text-light);font-weight:600;margin-bottom:6px">Você colheu <span id="finalGrown"></span> plantas!</p>
    <p style="font-size:1.3rem;font-weight:900;color:var(--primary-dark);margin-bottom:24px"><span id="finalScore"></span> pontos</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-secondary" onclick="startGame()">🔄 Nova Temporada</button>
      <a href="jogos.html" class="btn btn-primary">🎮 Outros Jogos</a>
    </div>
  </div>

  <div id="toastEl" class="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  <script>
    const BLOOMS = ['🌻','🌷','🌺','🌸','🌼'];
    let plots, seeds, water, score, grown, round, toastTimer;

    function startGame() {
      score = 0; grown = 0; round = 1;
      document.getElementById('plantComplete').classList.remove('active');
      document.getElementById('gardenGrid').style.display = 'grid';
      document.getElementById('endBtnWrap').style.display = 'flex';
      startRound();
    }

    function startRound() {
      seeds = 6; water = 9;
      plots = Array(9).fill(null).map(() => ({ state: 'empty', bloom: null, waters: 0 }));
      document.getElementById('pRound').textContent = round + '/3';
      updateUI();
      renderGarden();
      updateHint();
    }

    function updateUI() {
      document.getElementById('pScore').textContent = score;
      document.getElementById('pGrown').textContent = grown;
      document.getElementById('seedCount').textContent = seeds;
      document.getElementById('waterCount').textContent = water;
      document.getElementById('chipSeeds').classList.toggle('depleted', seeds <= 0);
      document.getElementById('chipWater').classList.toggle('depleted', water <= 0);
    }

    function renderGarden() {
      document.getElementById('gardenGrid').innerHTML = plots.map((p, i) => {
        let emoji = '';
        if (p.state === 'seed')   emoji = '🌱';
        if (p.state === 'sprout') emoji = '🌿';
        if (p.state === 'bloom')  emoji = p.bloom;
        const dots = p.state !== 'empty' && p.state !== 'bloom'
          ? '<div class="water-dots">'
            + '<div class="water-dot' + (p.waters >= 1 ? ' filled' : '') + '"></div>'
            + '<div class="water-dot' + (p.waters >= 2 ? ' filled' : '') + '"></div>'
            + '</div>'
          : '';
        return '<div class="plot state-' + p.state + '" onclick="clickPlot(' + i + ')">'
          + emoji + dots + '</div>';
      }).join('');
    }

    function clickPlot(i) {
      const p = plots[i];
      if (p.state === 'empty') {
        if (seeds <= 0) { toast('Sem sementes! 🌱'); return; }
        p.state = 'seed';
        p.bloom = BLOOMS[Math.floor(Math.random() * BLOOMS.length)];
        p.waters = 0;
        seeds--;
        toast('Semente plantada! 🌱');
      } else if (p.state === 'seed' || p.state === 'sprout') {
        if (water <= 0) { toast('Sem água! 💧'); return; }
        water--;
        p.waters++;
        p.state = p.waters >= 2 ? 'bloom' : 'sprout';
        if (p.state === 'bloom') toast('Floresceu! ' + p.bloom + ' Clique para colher!');
        else toast('Regado! 💧 Mais uma água para florescer!');
      } else if (p.state === 'bloom') {
        score += 15;
        grown++;
        p.state = 'empty'; p.bloom = null; p.waters = 0;
        toast('+15 pontos! 🎉');
        checkAutoEnd();
      }
      updateUI();
      renderGarden();
      updateHint();
    }

    function updateHint() {
      const hasEmpty = plots.some(p => p.state === 'empty');
      const hasPlanted = plots.some(p => p.state === 'seed' || p.state === 'sprout');
      const hasBloomed = plots.some(p => p.state === 'bloom');
      if (hasBloomed)       document.getElementById('hintBar').textContent = 'Planta florescida! Clique para colher 🧺';
      else if (hasPlanted && water > 0)  document.getElementById('hintBar').textContent = 'Regue as plantas para elas crescerem! 💧';
      else if (hasEmpty && seeds > 0)    document.getElementById('hintBar').textContent = 'Clique em um canteiro vazio para plantar! 🌱';
      else if (water <= 0 && seeds <= 0) document.getElementById('hintBar').textContent = 'Recursos esgotados! Encerre a safra. 🧺';
      else                               document.getElementById('hintBar').textContent = 'Encerre a safra quando quiser! 🧺';
    }

    function checkAutoEnd() {
      const noMoves = seeds <= 0 && water <= 0 && !plots.some(p => p.state === 'bloom');
      if (noMoves) setTimeout(endRound, 600);
    }

    function endRound() {
      if (round < 3) {
        round++;
        toast('Safra ' + (round - 1) + ' encerrada! Começando safra ' + round + '...');
        setTimeout(startRound, 1500);
      } else {
        showComplete();
      }
    }

    function showComplete() {
      document.getElementById('gardenGrid').style.display = 'none';
      document.getElementById('endBtnWrap').style.display = 'none';
      document.getElementById('finalGrown').textContent = grown;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('plantComplete').classList.add('active');
      VS.saveGameScore('plantio', score);
    }

    function toast(msg) {
      const el = document.getElementById('toastEl');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    VS.init().then(() => {
      VS.requireAuth();
      VS.renderHeader(null);
      startGame();
    });
  </script>
</body>
</html>

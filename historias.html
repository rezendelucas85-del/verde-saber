<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Verde Saber – Histórias</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home.html" class="header-logo">
      <span class="header-logo-icon">🌱</span>
      <h1>Verde Saber</h1>
    </a>
    <div class="student-badge" id="studentBadge" onclick="VS.logout()" title="Sair"></div>
  </header>

  <div class="page-header">
    <a href="home.html" class="back-btn">← Início</a>
    <h1>📚 Histórias</h1>
    <p>Aventuras sobre natureza e meio ambiente!</p>
  </div>

  <div class="stories-list" id="storiesList"></div>

  <nav class="app-footer" id="appFooter"></nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  <script>
    VS.init().then(() => {
      VS.requireAuth();
      VS.renderHeader('historias');

      const student = VS.getCurrentStudent();
      document.getElementById('storiesList').innerHTML = STORIES.map(story => {
        const prog = student.progress?.stories?.[story.id];
        const completed = prog?.completed;
        const stars = prog?.stars || 0;
        return `
          <a href="historia.html?id=${story.id}" class="story-card">
            <div class="story-card-banner" style="background:${story.gradient}">
              <span style="font-size:4rem">${story.icon}</span>
              ${completed ? `<span style="position:absolute;top:10px;right:12px;font-size:1.5rem">${'⭐'.repeat(stars)}</span>` : ''}
            </div>
            <div class="story-card-body">
              <h3>${story.title}</h3>
              <p>${story.description}</p>
              <div class="story-meta">
                <span class="story-pages">📖 ${story.totalPages} páginas</span>
                ${completed
                  ? `<span class="story-completed">✅ Concluída</span>`
                  : `<span class="story-completed" style="background:#FFF9C4;color:#E65100">▶ Ler agora</span>`
                }
              </div>
            </div>
          </a>`;
      }).join('');
    });
  </script>
</body>
</html>
